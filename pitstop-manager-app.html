      <div><div class="stat-label" style="margin:0 0 4px;">Moyenne · ${v.fuelLogs.length} ${elec?'recharge':'plein'}${v.fuelLogs.length>1?'s':''}</div><div class="stat-val">${avg.toFixed(1)}<span class="unit">${consUnit(v)}</span></div></div>
      <div style="text-align:right;"><div class="stat-label" style="margin:0 0 4px;">${elec?'Énergie totale':'Carburant total'}</div><div style="font-family:var(--f-data);font-size:15px;color:var(--t1);">${fmt(totalL)} ${eu}${fuelSpend(v)>0?` · ${fmtPrice(fuelSpend(v))}`:''}</div></div></div>`;
    const lf = latestFill(v);
    if(lf && fillAnomaly(lf,v)>0){
      html += `<div class="empty" style="border-style:solid;border-color:rgba(239,68,68,0.3);color:var(--danger);text-align:left;display:flex;gap:10px;align-items:center;margin-bottom:8px;"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M8 1.5l6.5 12h-13L8 1.5z" stroke="var(--danger)" stroke-width="1.3" stroke-linejoin="round"/><line x1="8" y1="6" x2="8" y2="9.5" stroke="var(--danger)" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.5" r="0.8" fill="var(--danger)"/></svg><span>Dernier ${elec?'plein':'plein'} en surconsommation (>${settings.warnConsPct}% au-dessus de la moyenne).</span></div>`;
    }
    html += logs.slice(0,3).map((f,i)=>fuelRow(v,f,logs,i)).join('');
    html += `<div style="text-align:right;margin-top:8px;"><span class="sec-link" onclick="openModal('fuelAll',{vehicleId:${v.id}})">${v.fuelLogs.length>3?`Voir ${elec?'toutes les recharges':'tous les pleins'} (${v.fuelLogs.length})`:'Voir le graphique'} →</span></div>`;
  } else { html += `<div class="empty">Aucun${elec?'e recharge enregistrée':' plein enregistré'}. Ajoute ${elec?'tes recharges':'tes pleins'} pour suivre la consommation.</div>`; }
  html += addBtn(elec?'Ajouter une recharge':'Ajouter un plein', `openModal('addFuel',{vehicleId:${v.id}})`);
  }

  /* compteur (historique) */
  html += `<div class="sec-title">Compteur</div>`;
  html += usageSection(v);
  html += addBtn('Relever le compteur', `openModal('logUsage',{vehicleId:${v.id}})`);

  /* vérifications (niveaux, pression) */
  html += `<div class="sec-title">Vérifications</div>`;
  html += checksSection(v);
  html += addBtn('Faire une vérification', `openModal('addCheck',{vehicleId:${v.id}})`);
  html += `<button class="btn btn-secondary" style="margin-top:10px;" onclick="openModal('addCheckItem',{vehicleId:${v.id}})">Ajouter un élément à vérifier</button>`;

  if(isMine){
  /* coût de possession */
  html += `<div class="sec-title">Coût de possession</div>`;
  html += tcoSection(v);
  }

  /* entretiens / préconisations */
  html += `<div class="sec-title">Entretiens & préconisations</div>`;
  if(v.recos.length){
    html += v.recos.map(r=>{
      const rs = recoStatus(r,v); const c = SC[rs.s];
      return `<div class="row tap" onclick="openModal('recoActions',{vehicleId:${v.id},recoId:${r.id}})">
        <div class="row-icon" style="background:${SD[rs.s]};">${icon(r.type,c)}</div>
        <div class="row-body"><div class="row-name">${r.name}</div><div class="row-sub">${rs.detail}</div></div>
        <span class="badge ${rs.s}"><span class="dot"></span>${rs.label}</span>
      </div>`;
    }).join('');
  } else { html += `<div class="empty">Aucune préconisation. Ajoute-en une (ex : vidange tous les 10 000 km).</div>`; }
  html += addBtn('Ajouter une préconisation', `openModal('addReco',{vehicleId:${v.id}})`);

  /* historique */
  if(v.history.length){
    const hist = [...v.history].sort((a,b)=>new Date(b.date)-new Date(a.date));
    html += `<div class="sec-title">Historique des entretiens</div>`;
    html += hist.slice(0,3).map(h=>historyRow(v,h)).join('');
    html += `<div style="text-align:right;margin-top:8px;"><span class="sec-link" onclick="openModal('historyAll',{vehicleId:${v.id}})">${v.history.length>3?`Voir tout l'historique (${v.history.length})`:'Voir les dépenses'} →</span></div>`;
  }

  /* échéances */
  html += `<div class="sec-title">Échéances</div>`;
  if(v.deadlines.length){
    html += v.deadlines.map(d=>{
      const ds = deadlineStatus(d); const c = SC[ds.s];
      return `<div class="row tap" onclick="openModal('deadlineActions',{vehicleId:${v.id},deadlineId:${d.id}})">
        <div class="row-icon" style="background:${SD[ds.s]};">${icon('date',c)}</div>
        <div class="row-body"><div class="row-name">${d.name}</div><div class="row-sub">${ds.detail}</div></div>
        <span class="badge ${ds.s}"><span class="dot"></span>${ds.label}</span>
      </div>`;
    }).join('');
  } else { html += `<div class="empty">Aucune échéance enregistrée.</div>`; }
  html += addBtn('Ajouter une échéance', `openModal('addDeadline',{vehicleId:${v.id}})`);

  /* notes libres */
  html += `<div class="sec-title">Notes</div>`;
  html += notesSection(v);
  html += addBtn('Ajouter une note', `openModal('addNote',{vehicleId:${v.id}})`);

  /* actions véhicule */
  html += `<div style="margin-top:24px;">`;
  html += `<button class="btn btn-secondary" onclick="openModal('editVehicle',{vehicleId:${v.id}})">${editSvg}Modifier le véhicule</button>`;
  html += `<button class="btn btn-secondary" style="margin-top:10px;" onclick="exportVehiclePdf(${v.id})"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5l3 3V14a.5.5 0 0 1-.5.5h-7A.5.5 0 0 1 4 14V1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 1.5v3h3" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Exporter en PDF</button>`;
  if(isMine){
  html += `<button class="btn btn-secondary" style="margin-top:10px;" onclick="openModal('saleListing',{vehicleId:${v.id}})"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.6 7.6V3.4a1 1 0 0 1 1-1h4.1l5.9 5.9a1 1 0 0 1 0 1.4l-3.7 3.7a1 1 0 0 1-1.4 0L2.6 7.6z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="5.4" cy="5.4" r="1" fill="currentColor"/></svg>Générer une annonce de vente</button>`;
  if(v.status==='owned'){
    html += `<button class="btn btn-primary" style="margin-top:10px;" onclick="openModal('sell',{vehicleId:${v.id}})">Mettre en vente</button>`;
  } else if(v.status==='for_sale'){
    html += `<button class="btn btn-primary" style="margin-top:10px;" onclick="markSold(${v.id})">Marquer comme vendu</button><button class="btn btn-secondary" style="margin-top:10px;" onclick="cancelSale(${v.id})">Retirer de la vente</button>`;
  } else {
    html += `<div class="empty" style="border-style:solid;margin-top:10px;">Ce véhicule a été vendu${v.salePrice?` pour ${fmtPrice(v.salePrice)}`:''}.</div>`;
  }
  }
  html += `<button class="btn btn-danger" style="margin-top:10px;" onclick="confirmDeleteVehicle(${v.id})">${trashSvg}Supprimer le véhicule</button></div>`;
  return html;
}

/* ── ECHEANCES ── */
function viewEcheances(){
  const allA = allAlerts();
  const alerts = allA.filter(a=>(a.veh.owner||'me')==='me');
  const otherAlerts = allA.filter(a=>(a.veh.owner||'me')==='other');
  if(!alerts.length && !otherAlerts.length) return `<div class="empty" style="margin-top:12px;">Aucune échéance à venir. Tout est à jour.</div>`;
  const danger = alerts.filter(a=>a.st.s==='danger'); const warn = alerts.filter(a=>a.st.s==='warn');
  let html = '';
  if(danger.length){ html += `<div class="sec-title" style="color:var(--danger);">En retard · ${danger.length}</div>` + danger.map(a=>alertRow(a)).join(''); }
  if(warn.length){ html += `<div class="sec-title" style="color:var(--warn);">À venir · ${warn.length}</div>` + warn.map(a=>alertRow(a)).join(''); }
  if(!alerts.length){ html += `<div class="empty" style="margin-top:12px;">Tes véhicules sont à jour.</div>`; }
  if(otherAlerts.length){
    const oDanger = otherAlerts.filter(a=>a.st.s==='danger'); const oWarn = otherAlerts.filter(a=>a.st.s==='warn');
    html += `<div class="sec-title" style="margin-top:24px;">Véhicules des autres</div>`;
    if(oDanger.length){ html += `<div class="sec-title" style="color:var(--danger);">En retard · ${oDanger.length}</div>` + oDanger.map(a=>alertRow(a)).join(''); }
    if(oWarn.length){ html += `<div class="sec-title" style="color:var(--warn);">À venir · ${oWarn.length}</div>` + oWarn.map(a=>alertRow(a)).join(''); }
  }
  return html;
}

/* ── FINANCE ── */
function euroIcon(c){ return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.5 4.6a4 4 0 1 0 0 6.8" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/><path d="M3.4 7h6M3.4 9.2h5.2" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/></svg>`; }
function viewFinance(){
  const all = vehicles.filter(v=>(v.owner||'me')==='me');
  const others = vehicles.filter(v=>(v.owner||'me')==='other');
  const active = all.filter(v=>v.status!=='sold');
  const totalFuel = all.reduce((s,v)=>s+fuelSpend(v),0);
  const totalMaint = all.reduce((s,v)=>s+maintSpend(v),0);
  const total = totalFuel + totalMaint;
  const parcValue = active.reduce((s,v)=>s+(v.estValue||0),0);
  const invested = active.reduce((s,v)=>s+(v.purchasePrice||0),0);
  const diff = parcValue - invested;
  const avgPerVeh = active.length ? total/active.length : 0;

  let html = `<div class="stat-grid" style="margin-top:8px;">
    <div class="stat"><div class="stat-icon" style="background:var(--accent-dim);">${euroIcon('var(--accent)')}</div><div class="stat-val">${fmt(total)}<span class="unit">€</span></div><div class="stat-label">Dépenses totales</div></div>
    <div class="stat"><div class="stat-icon" style="background:var(--info-dim);">${icon('oil','var(--info)')}</div><div class="stat-val">${fmt(totalMaint)}<span class="unit">€</span></div><div class="stat-label">Entretien</div></div>
    <div class="stat"><div class="stat-icon" style="background:var(--accent-dim);">${icon('fuel','var(--accent)')}</div><div class="stat-val">${fmt(totalFuel)}<span class="unit">€</span></div><div class="stat-label">Carburant</div></div>
    <div class="stat"><div class="stat-icon" style="background:var(--ok-dim);">${euroIcon('var(--ok)')}</div><div class="stat-val">${fmt(parcValue/1000)}<span class="unit">k €</span></div><div class="stat-label">Valeur du parc</div></div>
  </div>`;

  const years = expenseYears();
  if(state.financeYear==null || !years.includes(state.financeYear)){ const cur=new Date().getFullYear(); state.financeYear = years.includes(cur)?cur:years[years.length-1]; }
  const yi = years.indexOf(state.financeYear);
  const yr = spendInYear(state.financeYear);
  const yrMap = {}; if(yr.maint>0) yrMap.maint=yr.maint; if(yr.fuel>0) yrMap.fuel=yr.fuel;
  html += `<div class="sec-title">Répartition des dépenses
    <span class="year-nav">
      <button class="year-arrow" onclick="financeYear(-1)" ${yi<=0?'disabled':''} aria-label="Année précédente">‹</button>
      <span class="year-cur">${state.financeYear}</span>
      <button class="year-arrow" onclick="financeYear(1)" ${yi>=years.length-1?'disabled':''} aria-label="Année suivante">›</button>
    </span></div>`;
  html += `<div class="stat" style="padding:16px;" ontouchstart="fySwipeStart(event)" ontouchend="fySwipeEnd(event)">${donutSVG(yrMap)}</div>`;

  html += `<div class="sec-title">Dépenses par véhicule</div>`;
  const rows = active.map(v=>({v, t:totalSpend(v), cpu:costPerUnit(v)})).sort((a,b)=>b.t-a.t);
  if(rows.some(r=>r.t>0)){
    html += rows.map(r=>{
      const cpu = r.cpu!=null ? `${r.cpu.toFixed(r.v.unit==='h'?1:2)} €/${unitL(r.v)}` : 'usage non suivi';
      const detail = `entretien ${fmt(maintSpend(r.v))} € · carburant ${fmt(fuelSpend(r.v))} € · ${cpu}`;
      return `<div class="row tap" onclick="openVehicle(${r.v.id})">
        <div class="row-icon" style="background:var(--bg-4);">${icon('tire','var(--t2)')}</div>
        <div class="row-body"><div class="row-name">${vehTitle(r.v)}</div><div class="row-sub">${detail}</div></div>
        <div style="font-family:var(--f-data);font-size:13px;color:var(--t1);">${fmtPrice(r.t)}</div>
      </div>`;
    }).join('');
  } else { html += `<div class="empty">Pas encore de dépense enregistrée par véhicule.</div>`; }

  html += `<div class="sec-title">Budget prévisionnel · 12 mois</div>`;
  const pj = projection12();
  if(pj.total>0){
    html += `<div class="stat" style="padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;">
      <div><div class="stat-label" style="margin:0 0 4px;">Estimation sur 12 mois</div><div class="stat-val">${fmt(pj.total)}<span class="unit">€</span></div></div>
      <div style="text-align:right;"><div class="stat-label" style="margin:0 0 4px;">Soit par mois</div><div style="font-family:var(--f-data);font-size:15px;color:var(--t1);">${fmt(pj.monthly)} €</div></div></div>`;
    html += `<div class="detail-grid">
      <div class="detail-cell"><div class="detail-cell-l">Énergie (annualisée)</div><div class="detail-cell-v">${fmtPrice(pj.energyYear)}</div></div>
      <div class="detail-cell"><div class="detail-cell-l">Entretien (12 derniers mois)</div><div class="detail-cell-v">${fmtPrice(pj.maint12)}</div></div>
    </div>`;
    html += `<div style="font-size:11px;color:var(--t3);margin-top:8px;line-height:1.45;">Estimation basée sur tes dépenses passées : énergie ramenée à l'année et entretien des 12 derniers mois.</div>`;
  } else { html += `<div class="empty">Ajoute des pleins et des entretiens avec leur coût pour obtenir une projection.</div>`; }

  html += `<div class="sec-title">Patrimoine</div>
    <div class="detail-grid">
      <div class="detail-cell"><div class="detail-cell-l">Investi (achats)</div><div class="detail-cell-v">${fmtPrice(invested)}</div></div>
      <div class="detail-cell"><div class="detail-cell-l">Valeur estimée</div><div class="detail-cell-v">${fmtPrice(parcValue)}</div></div>
      <div class="detail-cell"><div class="detail-cell-l">Plus / moins-value</div><div class="detail-cell-v" style="color:${diff>=0?'var(--ok)':'var(--danger)'};">${diff>=0?'+':'−'}${fmtPrice(Math.abs(diff))}</div></div>
      <div class="detail-cell"><div class="detail-cell-l">Dépense moy. / véhicule</div><div class="detail-cell-v">${fmtPrice(avgPerVeh)}</div></div>
    </div>`;

  html += `<div class="sec-title">Comparatif du parc <span style="color:var(--t3);font-weight:500;">(véhicules vendus inclus)</span></div>`;
  if(all.length){
    html += all.map(v=>{
      const cs = vehicleCompareStats(v);
      const statusBadge = v.status==='sold' ? `<span class="badge sold">Vendu</span>` : v.status==='for_sale' ? `<span class="badge sale"><span class="dot"></span>En vente</span>` : '';
      const detail = `${cs.cpuLabel} · ${cs.consLabel}`;
      return `<div class="row tap" onclick="openVehicle(${v.id})">
        <div class="row-icon" style="background:var(--bg-4);">${icon('tire','var(--t2)')}</div>
        <div class="row-body"><div class="row-name">${vehTitle(v)} ${statusBadge}</div><div class="row-sub">${detail}</div></div>
        <div style="text-align:right;"><div style="font-family:var(--f-data);font-size:13px;color:var(--t1);">${cs.valueLabel}</div><div style="font-size:10px;color:var(--t3);margin-top:2px;">${cs.valueSub}</div></div>
      </div>`;
    }).join('');
  } else { html += `<div class="empty">Aucun véhicule dans le parc.</div>`; }
  html += `<button class="btn btn-secondary" style="margin-top:12px;" onclick="openModal('compareVehicles')">Comparer deux véhicules</button>`;

  if(others.length){
    const tiersTotal = others.reduce((s,v)=>s+maintSpend(v),0);
    html += `<div class="sec-title" style="margin-top:24px;">Dépenses pour des tiers</div>`;
    html += `<div style="font-size:11px;color:var(--t3);line-height:1.5;margin-bottom:10px;">Ce que tu as payé ou avancé pour l'entretien des véhicules des autres. Séparé du patrimoine et du comparatif ci-dessus.</div>`;
    html += `<div class="stat" style="padding:16px;margin-bottom:8px;"><div class="stat-label" style="margin:0 0 4px;">Total</div><div class="stat-val">${fmt(tiersTotal)}<span class="unit">€</span></div></div>`;
    html += others.map(v=>{
      const t = maintSpend(v);
      return `<div class="row tap" onclick="openVehicle(${v.id})">
        <div class="row-icon" style="background:var(--bg-4);">${icon('tire','var(--t2)')}</div>
        <div class="row-body"><div class="row-name">${vehTitle(v)}</div><div class="row-sub">${v.ownerName?escapeHtml(v.ownerName):'Propriétaire non précisé'}</div></div>
        <div style="font-family:var(--f-data);font-size:13px;color:var(--t1);">${fmtPrice(t)}</div>
      </div>`;
    }).join('');
  }
  return html;
}

    `}

    <div style="text-align:center;margin-top:24px;"><div style="font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:0.04em;color:var(--t3);">PITSTOP <span style="color:var(--accent);">MANAGER</span></div><div style="font-family:var(--f-data);font-size:10px;color:var(--t3);letter-spacing:0.12em;margin-top:3px;">v2.0 <span class="help-icon" onclick="openModal('help')" title="Aide">?</span></div></div>
  </div>`;
}

/* ════════════ MODALS ════════════ */
function renderModal(){
  const m = document.getElementById('modal');
  if(!state.modal){ m.innerHTML=''; return; }
  let inner='';
  switch(state.modal){
    case 'confirm':         inner = modalConfirm(); break;
    case 'addVehicle':      inner = modalAddVehicle(); break;
    case 'editVehicle':     inner = modalEditVehicle(); break;
    case 'sell':            inner = modalSell(); break;
    case 'addReco':         inner = modalReco(false); break;
    case 'editReco':        inner = modalReco(true); break;
    case 'recoActions':     inner = modalRecoActions(); break;
    case 'markRecoDone':    inner = modalMarkDone(); break;
    case 'addDeadline':     inner = modalDeadline(false); break;
    case 'editDeadline':    inner = modalDeadline(true); break;
    case 'deadlineActions': inner = modalDeadlineActions(); break;
    case 'reportDeadline':  inner = modalReportDeadline(); break;
    case 'addFuel':         inner = modalFuel(false); break;
    case 'editFuel':        inner = modalFuel(true); break;
    case 'fuelActions':     inner = modalFuelActions(); break;
    case 'historyActions':  inner = modalHistoryActions(); break;
    case 'editHistory':     inner = modalEditHistory(); break;
    case 'historyAll':      inner = modalHistoryAll(); break;
    case 'fuelAll':         inner = modalFuelAll(); break;
    case 'export':          inner = modalExport(); break;
    case 'import':          inner = modalImport(); break;
    case 'logUsage':        inner = modalLogUsage(); break;
    case 'usageAll':        inner = modalUsageAll(); break;
    case 'saleListing':     inner = modalSaleListing(); break;
    case 'choice':          inner = modalChoice(); break;
    case 'addCheck':        inner = modalAddCheck(); break;
    case 'checksAll':       inner = modalChecksAll(); break;
    case 'addCheckItem':    inner = modalAddCheckItem(); break;
    case 'editCheckItem':   inner = modalEditCheckItem(); break;
    case 'addNote':         inner = modalAddNote(); break;
    case 'addSpec':         inner = modalAddSpec(); break;
    case 'editSpec':        inner = modalEditSpec(); break;
    case 'compareVehicles': inner = modalCompareVehicles(); break;
    case 'pickVehicleShortcut': inner = modalPickVehicleShortcut(); break;
    case 'globalSearch':    inner = modalGlobalSearch(); break;
    case 'consistency':     inner = modalConsistency(); break;
    case 'help':             inner = modalHelp(); break;
  }
  m.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-handle"></div>${inner}</div></div>`;
}

function modalConfirm(){
  const c = state.ctx;
  return `<div class="modal-title">${c.title}</div><div class="modal-desc">${c.message}</div>
    <div class="btn-row"><button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn ${c.danger?'btn-danger':'btn-primary'}" onclick="runConfirm()">${c.confirmLabel}</button></div>`;
}

function modalRecoActions(){

function modalMarkDone(){

  return `<div class="modal-title">ENTRETIEN EFFECTUÉ</div><div class="modal-desc">${r.name} · prochain rappel calculé automatiquement (${bits.join(' / ')||'—'})</div>

function modalDeadlineActions(){
  const v = byId(state.ctx.vehicleId); const d = v.deadlines.find(x=>x.id===state.ctx.deadlineId); const ds = deadlineStatus(d);

function modalUsageAll(){
  const v = byId(state.ctx.vehicleId); const u=unitL(v);
  const log = [...(v.usageLog||[])].sort((a,b)=> new Date(b.date)-new Date(a.date));
  const asc = [...log].reverse();
  const rows = log.map((e,i)=>{
    const idxAsc = asc.findIndex(x=>x.id===e.id);
    const prev = asc[idxAsc-1];
    const isDrop = prev && e.value < prev.value;
    const delta = prev ? (e.value-prev.value) : null;
    return `<div class="row">
      <div class="row-icon" style="background:${isDrop?'var(--danger-dim)':'var(--bg-4)'};">${icon('gauge', isDrop?'var(--danger)':'var(--t2)')}</div>
      <div class="row-body"><div class="row-name">${fmt(e.value)} ${u}${delta!=null?`<span class="delta" style="color:${isDrop?'var(--danger)':'var(--t3)'};">${delta>=0?'+':''}${fmt(delta)}</span>`:''}</div><div class="row-sub">${fmtDate(e.date)}${isDrop?' · correction':''}</div></div>
      <button class="icon-del" onclick="deleteUsageEntry(${v.id},${e.id})" aria-label="Supprimer">${trashSvg}</button>
    </div>`;
  }).join('');
  return `<div class="modal-title">HISTORIQUE DU COMPTEUR</div><div class="modal-desc">${vehTitle(v)} · ${log.length} relevé(s). Supprime un point erroné pour corriger la courbe (n'affecte pas les pleins ni les entretiens liés).</div>

}

  let rows = '';

    const ca = vehicleCompareStats(a), cb = vehicleCompareStats(b);
    const line = (label, va, vb) => `<div class="cmp-row"><div class="cmp-l">${va}</div><div class="cmp-m">${label}</div><div class="cmp-r">${vb}</div></div>`;

      ${line('Dépenses totales', fmtPrice(ca.total), fmtPrice(cb.total))}
      ${line('Coût / unité', ca.cpuLabel, cb.cpuLabel)}
      ${line('Consommation', ca.consLabel, cb.consLabel)}
      ${line(ca.valueSub==='prix de vente'||cb.valueSub==='prix de vente' ? 'Valeur / prix de vente' : 'Valeur estimée', ca.valueLabel, cb.valueLabel)}
    </div>`;

/* fuel */
function latestReading(v){
  const log = v.usageLog||[]; if(!log.length) return null;
  return [...log].sort((a,b)=> new Date(b.date)-new Date(a.date))[0];
}
function daysAgo(dateStr){ return Math.max(0, Math.round((new Date()-new Date(dateStr))/86400000)); }
function distanceWarning(v, dist){
  const recent = v.fuelLogs.slice(-5).map(f=>f.distance).filter(d=>d>0);
  if(recent.length<2) return null;
  const avg = recent.reduce((s,d)=>s+d,0)/recent.length;
  if(dist > avg*3.5 && dist-avg > 300) return `Distance très supérieure à ta moyenne récente (~${fmt(Math.round(avg))} ${unitL(v)}) : vérifie que c'est bien la distance depuis le dernier plein, pas le compteur total.`;
  return null;
}
function doSaveFuel(v, liters, dist, cost, date){
  v.fuelLogs.push({id:++nextId, date, liters, distance:dist, cost}); v.usage += dist;
  logUsage(v, v.usage, date);
  closeModal(); save(); render(); toast(isElectric(v)?'Recharge ajoutée':'Plein ajouté');
}
function saveFuel(){
  const v=byId(state.ctx.vehicleId); const liters=flt('f-liters'); const dist=num('f-dist'); const cost=flt('f-fcost'); const date=val('f-fdate')||todayISO();
  if(!liters||!dist){ toast('Renseigne la quantité et la distance.'); return; }
  const warn = distanceWarning(v, dist);
  if(warn){ confirmDialog('Kilométrage inhabituel', warn+' Confirmer quand même ?', 'Confirmer et enregistrer', ()=>doSaveFuel(v, liters, dist, cost, date)); return; }
  doSaveFuel(v, liters, dist, cost, date);
}
function doSaveEditFuel(v, f, liters, dist, cost, date){
  v.usage += (dist - f.distance); if(v.usage<0) v.usage=0;
  f.liters=liters; f.distance=dist; f.cost=cost; f.date=date;
  logUsage(v, v.usage, date);
  closeModal(); save(); render(); toast('Plein modifié');
}
function saveEditFuel(){
  const v=byId(state.ctx.vehicleId); const f=v.fuelLogs.find(x=>x.id===state.ctx.fuelId);
  const liters=flt('f-liters'); const dist=num('f-dist'); const cost=flt('f-fcost'); const date=val('f-fdate')||f.date;
  if(!liters||!dist){ toast('Renseigne la quantité et la distance.'); return; }
  const warn = distanceWarning({...v, fuelLogs: v.fuelLogs.filter(x=>x.id!==f.id)}, dist);
  if(warn){ confirmDialog('Kilométrage inhabituel', warn+' Confirmer quand même ?', 'Confirmer et enregistrer', ()=>doSaveEditFuel(v, f, liters, dist, cost, date)); return; }
  doSaveEditFuel(v, f, liters, dist, cost, date);
}

/* fiche de vente */
function buildSaleListing(v){
  const u=unitL(v); const lines=[];
  const title = [v.brand, v.model].filter(x=>x&&x.trim()).join(' ') || (v.name||'').trim() || catLabel(v);
  lines.push(`${title}${v.year?` (${v.year})`:''}`.toUpperCase());
  lines.push('');
  if(v.salePrice||v.estValue) lines.push(`Prix : ${fmtPrice(v.salePrice||v.estValue)}`);
  lines.push(`${unitName(v)} : ${fmt(v.usage)} ${u}`);
  if(v.fuel) lines.push(`${isElectric(v)?'Énergie':'Carburant'} : ${v.fuel}`);
  if(v.plate) lines.push(`Immatriculation : ${v.plate}`);
  const avg=avgCons(v); if(avg!=null) lines.push(`Consommation moyenne : ${avg.toFixed(1)} ${consUnit(v)}`);
  lines.push('');
  if(v.history.length){
    lines.push('Entretien suivi :');
    [...v.history].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,6).forEach(h=>{

  lines.push('Suivi complet de l\'entretien disponible. N\'hésitez pas à me contacter pour plus d\'informations.');
  return lines.join('\n');
}

/* import des données (remplace le parc après confirmation) */
function applyImport(data){
  if(!data || !Array.isArray(data.vehicles)) { toast('Fichier invalide : aucun véhicule trouvé.'); return; }
  const count = data.vehicles.length;
  confirmDialog('Importer les données', `${count} véhicule(s) détecté(s). Tes données actuelles seront remplacées. Continuer ?`, 'Importer', ()=>{
    vehicles = data.vehicles;
    settings = Object.assign({}, DEFAULT_SETTINGS, data.settings||{});
    nextId = data.nextId || 600;
    if(data.sync && (data.sync.repo || data.sync.token)){
      sync.repo = data.sync.repo || '';
      sync.token = data.sync.token || '';
      sync.enabled = !!data.sync.enabled;
      sync.lastError = '';
    }
    migrate();
    // garantit un nextId supérieur à tous les ids présents
    let maxId = 0;
    vehicles.forEach(v=>{ maxId=Math.max(maxId, v.id||0); ['recos','history','deadlines','fuelLogs','usageLog'].forEach(k=>(v[k]||[]).forEach(x=>maxId=Math.max(maxId, x.id||0))); });
    if(nextId <= maxId) nextId = maxId + 1;
    save(); state.tab='garage'; state.vehicleId=null; render(); toast('Données importées');
  });
}
function parseImport(raw){
  try{ return JSON.parse(raw); }
  catch(e){ toast('JSON illisible : vérifie le contenu collé.'); return null; }
}
function importFromText(){
  const raw = val('import-ta');
  if(!raw){ toast('Colle le contenu JSON ou choisis un fichier.'); return; }
  const data = parseImport(raw); if(data) applyImport(data);
}
function importFromFile(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = () => { const data = parseImport(String(reader.result)); if(data) applyImport(data); };
  reader.onerror = () => toast('Lecture du fichier impossible.');
  reader.readAsText(file);
}


/* ════════════ SYNCHRONISATION (dépôt GitHub privé) ════════════ */
let _pushTimer = null;
let _syncing = false;
let _pendingPush = false;

function syncConfigured(){ return !!(sync.repo && sync.token); }
function syncReady(){ return sync.enabled && syncConfigured(); }
function syncDataBlob(){
  const notifications = (notif.enabled && notif.subscription) ? { publicKey: notif.publicKey, subscription: notif.subscription } : null;
  return { app:'PitStop Manager', version:3, dataUpdatedAt, exportedAt:new Date().toISOString(), settings, nextId, onboarded, vehicles, notifications };
}

function strToB64(str){ const bytes=new TextEncoder().encode(str); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); }
function b64ToStr(b64){ const bin=atob(String(b64).replace(/\s/g,'')); const bytes=Uint8Array.from(bin, c=>c.charCodeAt(0)); return new TextDecoder().decode(bytes); }

function ghApiUrl(){
  const repo = sync.repo.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  return `https://api.github.com/repos/${repo}/contents/backup.json`;
}
function ghHeaders(){ return { 'Authorization':'Bearer '+sync.token.trim(), 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }; }

/* Récupère le fichier distant : {found, sha, blob} ou lève une erreur */
async function ghFetchRemote(){
  const res = await fetch(ghApiUrl()+'?ref=HEAD&t='+Date.now(), { headers: ghHeaders(), cache:'no-store' });
  if(res.status===404) return { found:false, sha:null, blob:null };
  if(res.status===401) throw new Error('Token refusé (401). Vérifie le token.');
  if(res.status===403) throw new Error('Accès interdit (403). Droits du token ?');
  if(!res.ok) throw new Error('Erreur GitHub ('+res.status+').');
  const j = await res.json();
  let blob=null; try{ blob = JSON.parse(b64ToStr(j.content)); }catch(e){ blob=null; }
  return { found:true, sha:j.sha, blob };
}
/* Écrit le fichier distant avec le sha courant (création si absent) */
async function ghPutRemote(sha){
  const body = { message:'PitStop sync '+new Date().toISOString(), content: strToB64(JSON.stringify(syncDataBlob(), null, 2)) };
  if(sha) body.sha = sha;
  const res = await fetch(ghApiUrl(), { method:'PUT', headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()), body: JSON.stringify(body) });
  if(res.status===409) throw new Error('conflict');
  if(!res.ok) throw new Error('Envoi refusé ('+res.status+').');
  return true;
}

/* Pousse les données locales vers le dépôt (last-write-wins) */
async function syncPush(silent){
  if(!syncReady() || _syncing) { if(!syncReady()) return; _pendingPush=true; return; }
  if(typeof navigator!=='undefined' && navigator.onLine===false){ _pendingPush=true; return; }
  _syncing = true;
  try{
    let remote = await ghFetchRemote();
    await ghPutRemote(remote.sha);
    sync.lastSync = Date.now(); sync.lastError=''; _pendingPush=false; persist();
    if(!silent) toast('Sauvegarde en ligne à jour');
    renderSyncStatus();
  }catch(e){
    if(e.message==='conflict'){ try{ const r=await ghFetchRemote(); await ghPutRemote(r.sha); sync.lastSync=Date.now(); sync.lastError=''; _pendingPush=false; persist(); renderSyncStatus(); }catch(e2){ sync.lastError=e2.message; _pendingPush=true; persist(); renderSyncStatus(); } }
    else { sync.lastError = e.message; _pendingPush=true; persist(); if(!silent) toast('Synchro impossible : '+e.message); renderSyncStatus(); }
  }finally{ _syncing=false; flushPending(); }
}

/* Récupère la version en ligne et l'applique si elle est plus récente */
async function syncPull(silent){
  if(!syncReady() || _syncing) return;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return;
  _syncing = true;
  try{
    const remote = await ghFetchRemote();
    if(remote.found && remote.blob && Array.isArray(remote.blob.vehicles)){
      const remoteAt = remote.blob.dataUpdatedAt || 0;
      if(remoteAt > dataUpdatedAt){
        applyRemoteBlob(remote.blob);
        sync.lastSync = Date.now(); sync.lastError=''; persist();
        render();
        if(!silent) toast('Données récupérées depuis le cloud');
      } else {
        sync.lastSync = Date.now(); sync.lastError=''; persist(); renderSyncStatus();
        if(!silent) toast('Déjà à jour');
        if(dataUpdatedAt > remoteAt) _pendingPush=true;
      }
    } else if(!remote.found){
      if(!silent) toast('Aucune sauvegarde en ligne — envoi des données locales');
      _pendingPush=true;
    }
  }catch(e){ sync.lastError=e.message; persist(); if(!silent) toast('Récupération impossible : '+e.message); renderSyncStatus(); }
  finally{ _syncing=false; flushPending(); }
}

/* Renvoie un push en attente une fois le verrou libéré et la connexion dispo.
   Pas de relance après une erreur (évite une boucle) : on réessaiera à la
   prochaine modification, au retour en ligne, ou à la réouverture. */
function flushPending(){
  if(_pendingPush && syncReady() && !_syncing && !sync.lastError
     && !(typeof navigator!=='undefined' && navigator.onLine===false)){
    setTimeout(()=>syncPush(true), 60);
  }
}

function applyRemoteBlob(blob){
  vehicles = blob.vehicles || [];
  settings = Object.assign({}, DEFAULT_SETTINGS, blob.settings||{});
  nextId = blob.nextId || 600;
  if(typeof blob.onboarded==='boolean') onboarded = blob.onboarded;
  dataUpdatedAt = blob.dataUpdatedAt || Date.now();
  migrate();
  let maxId=0; vehicles.forEach(v=>{ maxId=Math.max(maxId, v.id||0); ['recos','history','deadlines','fuelLogs','usageLog'].forEach(k=>(v[k]||[]).forEach(x=>maxId=Math.max(maxId, x.id||0))); });
  if(nextId<=maxId) nextId=maxId+1;
  persist();
}

/* Envoi auto, temporisé, après chaque modification */
function schedulePush(){
  if(!syncReady()) return;
  if(_pushTimer) clearTimeout(_pushTimer);
  _pushTimer = setTimeout(()=>{ _pushTimer=null; syncPush(true); }, 1800);
}

/* À l'ouverture : récupère la version en ligne si plus récente */
function syncOnStartup(){ if(syncReady()) setTimeout(()=>syncPull(true), 300); }

/* Reprise quand la connexion revient */
if(typeof window!=='undefined'){
  window.addEventListener('online', ()=>{ if(syncReady() && _pendingPush) syncPush(true); });
}

/* ─ Réglages : actions de synchro ─ */
function renderSyncStatus(){
  const el = document.getElementById('sync-status'); if(!el) return;
  el.innerHTML = syncStatusHtml();
}
function syncStatusHtml(){
  if(!syncConfigured()) return `<span style="color:var(--t3);">Non configurée</span>`;

  const state_ = sync.enabled ? '<span style="color:var(--ok);">Activée</span>' : '<span style="color:var(--t3);">En pause</span>';
  return `${state_} · dernière synchro : ${when}`;
}
function fmtDateTime(ms){ const d=new Date(ms); return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }

function saveSyncField(k, v){ sync[k]=v.trim(); persist(); }

        'Récupérer le cloud (écrase l\'appareil)',

        'Garder l\'appareil (écrase le cloud)',
        ()=>{ sync.enabled=true; persist(); syncPush(false); render(); toast('Synchronisation activée (données de l\'appareil)'); }
      );

/* ════════════ NOTIFICATIONS PUSH ════════════ */
function b64urlEncode(buf){
  const bytes = new Uint8Array(buf);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlToUint8Array(str){
  const pad = '='.repeat((4 - str.length % 4) % 4);
  const base64 = (str + pad).replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(base64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function generateVapidKeys(){
  const kp = await crypto.subtle.generateKey({name:'ECDSA', namedCurve:'P-256'}, true, ['sign','verify']);
  const rawPublic = await crypto.subtle.exportKey('raw', kp.publicKey);
  const jwkPrivate = await crypto.subtle.exportKey('jwk', kp.privateKey);
  return { publicKey: b64urlEncode(rawPublic), privateKey: jwkPrivate.d };
}
function notifSupported(){ return typeof window!=='undefined' && 'serviceWorker' in navigator && 'PushManager' in window && typeof crypto!=='undefined' && crypto.subtle; }
async function enableNotifications(){
  if(!notifSupported()){ toast('Notifications non disponibles sur cet appareil/navigateur.'); return; }
  if(!syncConfigured()){ toast('Configure d\'abord la synchronisation : les notifications s\'appuient sur ton dépôt de données.'); return; }
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('Permission refusée pour les notifications.'); return; }
    const keys = await generateVapidKeys();
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64urlToUint8Array(keys.publicKey) });
    notif = { enabled:true, publicKey:keys.publicKey, privateKey:keys.privateKey, subscription: sub.toJSON(), lastError:'' };
    persist(); save(); render();
    toast('Notifications activées — télécharge les fichiers pour finir la configuration.');
  }catch(e){ notif.lastError = e.message; persist(); toast('Échec : '+e.message); render(); }
}
async function disableNotifications(){
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(sub) await sub.unsubscribe();
    }
  }catch(e){ /* on nettoie quand même localement */ }
  notif = { enabled:false, publicKey:'', privateKey:'', subscription:null, lastError:'' };
  persist(); save(); render(); toast('Notifications désactivées');
}
function downloadTextFile(filename, text, mime){
  try{
    const blob = new Blob([text], {type: mime||'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ toast('Téléchargement impossible : '+e.message); }
}

function handleShortcutAction(){

  const action = params.get('action');
  if(!action) return;

  if(!eligible.length){ state.tab='garage'; render(); toast('Ajoute un véhicule pour utiliser ce raccourci.'); return; }

  openModal('pickVehicleShortcut', {});
}

  const rows = eligible.map(v=>`<div class="row tap" onclick="chooseShortcutVehicle(${v.id})">
    <div class="row-icon" style="background:var(--bg-4);">${icon('tire','var(--t2)')}</div>
    <div class="row-body"><div class="row-name">${vehTitle(v)}</div><div class="row-sub">${v.plate||catLabel(v)}</div></div>
  </div>`).join('');
  return `<div class="modal-title">CHOISIR UN VÉHICULE</div><div class="modal-desc">Pour ${labels[state.pendingShortcut]||'cette action'}.</div>
    ${rows}
    <button class="btn btn-secondary" style="margin-top:12px;" onclick="state.pendingShortcut=null;closeModal();">Annuler</button>`;
}

window.addEventListener('resize', onResize);
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
load();
state.tab = settings.defaultTab || 'home';
state.garageSort = settings.defaultGarageSort || 'alert';
render();
syncOnStartup();
handleShortcutAction();
</script>
</body>
</html>
